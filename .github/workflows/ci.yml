name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.16.8
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Install the runtime deps too, so mypy resolves pydantic/httpx/tenacity
      # rather than falling back to ignore_missing_imports for everything.
      - run: pip install -r requirements.txt mypy==2.3.1
      - run: mypy researcher/

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      # No API keys in CI: every test is offline by design, and the provided
      # smoke tests are the graded ones.
      - run: pytest --cov=researcher --cov-fail-under=60 --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-assistant:${{ github.sha }} .
      # Prove the image's entry point is wired up. `demo` needs API keys, so
      # --help is the deepest check that works without secrets.
      - run: docker run --rm research-assistant:${{ github.sha }} python -m researcher --help
